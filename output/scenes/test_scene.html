<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pune — Mula and Mutha Confluence</title>
<style>
  :root {
    --ink: #0f1115;
    --ink-soft: #151a20;
    --saffron: #f2a33a;
    --river: #5fa8d3;
    --paper: #e8edf1;
    --muted: #89949e;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--ink);
    user-select: none;
    pointer-events: none;
  }

  .scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  text {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .subtitle {
    position: absolute;
    left: 50%;
    bottom: 36px;
    z-index: 10;
    max-width: calc(100vw - 48px);
    padding: 16px 30px 17px;
    transform: translateX(-50%) translateY(16px);
    border-left: 7px solid var(--saffron);
    border-radius: 4px 12px 12px 4px;
    background: rgba(15, 17, 21, 0.92);
    box-shadow: 0 14px 45px rgba(0, 0, 0, 0.48);
    color: var(--paper);
    font-size: clamp(19px, 1.65vw, 32px);
    font-weight: 720;
    line-height: 1.25;
    letter-spacing: 0.012em;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
  }

  .is-playing .title-kicker {
    animation: titleKicker 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .title-main {
    animation: titleRise 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .title-rule {
    animation: ruleDraw 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .title-detail {
    animation: detailIn 5s ease-out both;
  }

  .is-playing .map-frame {
    animation: frameIn 5s ease-out both;
  }

  .is-playing .map-grid {
    animation: gridIn 5s ease-out both;
  }

  .is-playing .topography {
    animation: detailIn 5s ease-out both;
  }

  .is-playing .city-blocks {
    animation: blocksIn 5s ease-out both;
  }

  .is-playing .roads-draw path {
    animation: roadsDraw 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .arterials-draw path {
    animation: arterialDraw 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .river-underlay {
    animation: riverUnderlay 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .river-blue {
    animation: riverBlue 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .river-highlight {
    animation: riverHighlight 5s ease-out both;
  }

  .is-playing .river-flow {
    animation: riverFlow 5s ease-out both;
  }

  .is-playing .river-label {
    animation: labelIn 5s ease-out both;
  }

  .is-playing .landmark {
    transform-box: fill-box;
    transform-origin: center;
    animation: landmarkIn 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .confluence-marker {
    transform-box: fill-box;
    transform-origin: center;
    animation: markerIn 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-playing .pulse-a {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseA 5s ease-out both;
  }

  .is-playing .pulse-b {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseB 5s ease-out both;
  }

  .is-playing .confluence-callout {
    animation: calloutIn 5s ease-out both;
  }

  .is-playing .north-arrow {
    animation: detailIn 5s ease-out both;
  }

  .is-playing .legend {
    animation: detailIn 5s ease-out both;
  }

  .is-playing .subtitle {
    animation: subtitleIn 5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .is-finished .title-kicker,
  .is-finished .title-main,
  .is-finished .title-rule,
  .is-finished .title-detail,
  .is-finished .map-frame,
  .is-finished .map-grid,
  .is-finished .topography,
  .is-finished .city-blocks,
  .is-finished .roads-draw path,
  .is-finished .arterials-draw path,
  .is-finished .river-underlay,
  .is-finished .river-blue,
  .is-finished .river-highlight,
  .is-finished .river-flow,
  .is-finished .river-label,
  .is-finished .landmark,
  .is-finished .confluence-marker,
  .is-finished .pulse-a,
  .is-finished .pulse-b,
  .is-finished .confluence-callout,
  .is-finished .north-arrow,
  .is-finished .legend,
  .is-finished .subtitle {
    animation-play-state: paused !important;
  }

  @keyframes titleKicker {
    0% { opacity: 0; transform: translateY(12px); }
    7% { opacity: 0; transform: translateY(12px); }
    18% { opacity: 1; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes titleRise {
    0% { opacity: 0; transform: translateY(28px); }
    8% { opacity: 0; transform: translateY(28px); }
    22% { opacity: 1; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes ruleDraw {
    0% { opacity: 0; transform: scaleX(0); }
    15% { opacity: 1; transform: scaleX(0); }
    32% { opacity: 1; transform: scaleX(1); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  @keyframes detailIn {
    0% { opacity: 0; }
    22% { opacity: 0; }
    38% { opacity: 1; }
    100% { opacity: 1; }
  }

  @keyframes frameIn {
    0% { opacity: 0; }
    8% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 1; }
  }

  @keyframes gridIn {
    0% { opacity: 0; }
    16% { opacity: 0; }
    31% { opacity: 1; }
    100% { opacity: 1; }
  }

  @keyframes blocksIn {
    0% { opacity: 0; }
    22% { opacity: 0; }
    39% { opacity: 1; }
    100% { opacity: 1; }
  }

  @keyframes roadsDraw {
    0% { opacity: 0; stroke-dashoffset: 1; }
    15% { opacity: 0.2; stroke-dashoffset: 1; }
    46% { opacity: 1; stroke-dashoffset: 0; }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  @keyframes arterialDraw {
    0% { opacity: 0; stroke-dashoffset: 1; }
    27% { opacity: 0; stroke-dashoffset: 1; }
    58% { opacity: 1; stroke-dashoffset: 0; }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  @keyframes riverUnderlay {
    0% { opacity: 0; stroke-dashoffset: 1; }
    7% { opacity: 1; stroke-dashoffset: 1; }
    55% { opacity: 1; stroke-dashoffset: 0; }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  @keyframes riverBlue {
    0% { opacity: 0; stroke-dashoffset: 1; }
    10% { opacity: 1; stroke-dashoffset: 1; }
    62% { opacity: 1; stroke-dashoffset: 0; }
    100% { opacity: 1; stroke-dashoffset: 0; }
  }

  @keyframes riverHighlight {
    0% { opacity: 0; }
    34% { opacity: 0; }
    58% { opacity: 0.68; }
    100% { opacity: 0.68; }
  }

  @keyframes riverFlow {
    0% { opacity: 0; stroke-dashoffset: 0; }
    24% { opacity: 0; stroke-dashoffset: 0; }
    35% { opacity: 0.82; stroke-dashoffset: 0; }
    76% { opacity: 0.5; stroke-dashoffset: -150; }
    100% { opacity: 0; stroke-dashoffset: -220; }
  }

  @keyframes labelIn {
    0% { opacity: 0; transform: translateY(8px); }
    55% { opacity: 0; transform: translateY(8px); }
    68% { opacity: 1; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes landmarkIn {
    0% { opacity: 0; transform: translateY(14px) scale(0.94); }
    42% { opacity: 0; transform: translateY(14px) scale(0.94); }
    57% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes markerIn {
    0% { opacity: 0; transform: scale(0.35); }
    50% { opacity: 0; transform: scale(0.35); }
    62% { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes pulseA {
    0%, 50% { opacity: 0; transform: scale(0.35); }
    59% { opacity: 0.92; transform: scale(0.8); }
    78% { opacity: 0; transform: scale(1.85); }
    100% { opacity: 0; transform: scale(1.85); }
  }

  @keyframes pulseB {
    0%, 58% { opacity: 0; transform: scale(0.35); }
    66% { opacity: 0.75; transform: scale(0.75); }
    87% { opacity: 0; transform: scale(2.05); }
    100% { opacity: 0; transform: scale(2.05); }
  }

  @keyframes calloutIn {
    0% { opacity: 0; transform: translateX(-12px); }
    58% { opacity: 0; transform: translateX(-12px); }
    71% { opacity: 1; transform: translateX(0); }
    100% { opacity: 1; transform: translateX(0); }
  }

  @keyframes subtitleIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(16px); }
    63% { opacity: 0; transform: translateX(-50%) translateY(16px); }
    78% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
