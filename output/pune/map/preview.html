<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pune Map Data Preview — 1920x1080</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f1115;
      color: #f3ead8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #header {
      position: absolute;
      top: 30px;
      left: 50px;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      color: #f2a33a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    p {
      margin: 5px 0 0 0;
      color: #5fa8d3;
      font-size: 16px;
    }
    svg {
      width: 100vw;
      height: 100vh;
      background: #0f1115;
    }
    .river {
      fill: none;
      stroke: #5fa8d3;
      stroke-width: 6px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(95, 168, 211, 0.4));
    }
    .landmark-dot {
      fill: #f2a33a;
      r: 7px;
      filter: drop-shadow(0 0 6px #f2a33a);
    }
    .landmark-label {
      fill: #f3ead8;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Pune — Map Data Layers</h1>
    <p>Projected 1920x1080 viewBox: Mula &amp; Mutha Rivers + Historic Landmarks</p>
  </div>
  <svg viewBox="0 0 1920 1080" id="map-svg"></svg>
  <script>
    fetch('svg_paths.json')
      .then(res => res.json())
      .then(data => {
        const svg = document.getElementById('map-svg');

        // Draw Mula River
        if (data.river_mula) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', data.river_mula.d);
          path.setAttribute('class', 'river');
          svg.appendChild(path);
        }

        // Draw Mutha River
        if (data.river_mutha) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', data.river_mutha.d);
          path.setAttribute('class', 'river');
          svg.appendChild(path);
        }

        // Draw Landmarks
        if (data.landmarks) {
          for (const [key, l] of Object.entries(data.landmarks)) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', l.x);
            circle.setAttribute('cy', l.y);
            circle.setAttribute('class', 'landmark-dot');
            svg.appendChild(circle);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', l.x + 12);
            text.setAttribute('y', l.y + 5);
            text.setAttribute('class', 'landmark-label');
            text.textContent = l.name;
            svg.appendChild(text);
          }
        }
      });
  </script>
</body>
</html>
